<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Your existing calendar CSS - keep as is */
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;--tag:#f0ede6;--danger:#ef4444;--purple:#8b5cf6;--orange:#f97316;--warning:#f59e0b;}
[data-theme="dark"]{--bg:#1a1a1a;--surface:#2d2d2d;--border:rgba(255,255,255,.1);--text:#e5e5e5;--muted:#9ca3af;--accent:#3b82f6;--tag:#3a3a3a;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);flex-wrap:wrap;gap:1rem;}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.user-info{display:flex;gap:1rem;align-items:center;}
.theme-toggle,.logout-btn{padding:6px 16px;background:var(--tag);border:.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text);}
.container{max-width:1400px;margin:0 auto;padding:2rem;flex:1;}
.tab-bar{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:1rem;flex-wrap:wrap;}
.tab-btn{background:none;border:none;padding:8px 20px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .2s;}
.tab-btn:hover{color:var(--text);background:var(--tag);}
.tab-btn.active{color:var(--accent);background:var(--tag);}
.calendar-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;}
.calendar-nav{display:flex;gap:.5rem;}
.calendar-nav button{padding:8px 16px;background:var(--surface);border:.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;}
.current-date{font-family:'DM Serif Display',serif;font-size:24px;}
.add-event-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;}
.week-view{background:var(--surface);border-radius:20px;border:.5px solid var(--border);overflow-x:auto;}
.week-header{display:grid;grid-template-columns:80px repeat(7,1fr);border-bottom:.5px solid var(--border);background:var(--tag);min-width:700px;}
.week-header-cell{padding:1rem;text-align:center;}
.week-header-day{font-weight:600;margin-bottom:4px;}
.week-body{display:flex;flex-direction:column;}
.week-row{display:grid;grid-template-columns:80px repeat(7,1fr);border-bottom:.5px solid var(--border);min-width:700px;}
.week-hour{padding:1rem;font-size:11px;color:var(--muted);text-align:right;border-right:.5px solid var(--border);background:var(--tag);}
.week-cell{min-height:80px;padding:4px;border-right:.5px solid var(--border);cursor:pointer;position:relative;}
.week-cell:hover{background:var(--tag);}
.month-view{display:none;background:var(--surface);border-radius:20px;border:.5px solid var(--border);overflow-x:auto;}
.month-header{display:grid;grid-template-columns:repeat(7,1fr);background:var(--tag);border-bottom:.5px solid var(--border);min-width:600px;}
.month-header-cell{padding:1rem;text-align:center;font-weight:500;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);min-width:600px;}
.month-day{min-height:120px;padding:8px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);cursor:pointer;position:relative;}
.month-day:hover{background:var(--tag);}
.month-day.other-month{background:rgba(0,0,0,.02);color:var(--muted);}
.month-day.today{background:rgba(37,99,235,.1);border:1px solid var(--accent);}
.day-number{font-size:14px;font-weight:500;margin-bottom:6px;}
.event-card{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center;}
.event-card.work{background:var(--accent);}
.event-card.personal{background:var(--purple);}
.event-card.meeting{background:var(--orange);}
.event-card.reminder{background:var(--warning);}
.event-card.deadline{background:var(--danger);}
.event-delete{background:rgba(0,0,0,0.3);color:#fff;border:none;border-radius:10px;padding:0 4px;margin-left:4px;cursor:pointer;font-size:8px;line-height:1;}
.event-delete:hover{background:rgba(0,0,0,0.6);}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border-radius:24px;padding:2rem;max-width:500px;width:90%;}
.modal h3{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:1rem;}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;margin:10px 0;border:.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.modal-buttons{display:flex;gap:1rem;margin-top:1rem;}
.modal-buttons button{flex:1;padding:12px;border-radius:12px;cursor:pointer;}
.modal-save{background:var(--accent);color:#fff;border:none;}
.modal-cancel{background:var(--surface);border:.5px solid var(--border);}
.reminder-checkbox{display:flex;align-items:center;gap:8px;margin:10px 0;}
.reminder-time{display:none;margin-top:8px;}
.reminder-time.active{display:block;}
.reminder-time select{width:100%;padding:10px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--text);}
footer{border-top:.5px solid var(--border);padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.footer-links{display:flex;gap:1.5rem;flex-wrap:wrap;}
.footer-links a{text-decoration:none;font-size:12px;color:var(--muted);}
@media(max-width:768px){.calendar-controls{flex-direction:column;align-items:stretch;}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<!-- ONE-TIME FORCE UPDATE -->
<script>
const APP_VERSION = '3';
if (localStorage.getItem('app_version') !== APP_VERSION) {
  if ('caches' in window) { caches.keys().then(keys => keys.forEach(key => caches.delete(key))); }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
  }
  localStorage.setItem('app_version', APP_VERSION);
  setTimeout(() => location.reload(true), 100);
}
</script>

<nav>
<a href="dashboard.html" class="logo">Sl<em>a</em>te</a>
<div class="user-info">
<span class="user-name" id="userNameDisplay">User</span>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
<button class="logout-btn" onclick="logout()">Sign out</button>
</div>
</nav>

<div class="container">
<div class="tab-bar">
<button class="tab-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
<button class="tab-btn active" onclick="window.location.href='calendar.html'">Calendar</button>
<button class="tab-btn" onclick="window.location.href='goals.html'">Goals</button>
<button class="tab-btn" onclick="window.location.href='support.html'">Support</button>
</div>

<div class="calendar-controls">
<div class="calendar-nav">
<button onclick="previousPeriod()">← Prev</button>
<button onclick="nextPeriod()">Next →</button>
<button onclick="goToToday()">Today</button>
<button onclick="switchView('week')" id="weekViewBtn" style="background:var(--accent);color:#fff;">Week</button>
<button onclick="switchView('month')" id="monthViewBtn">Month</button>
</div>
<div class="current-date" id="currentDateDisplay"></div>
<button class="add-event-btn" onclick="openAddEventModal()">+ Add Event</button>
</div>

<div id="weekView" class="week-view"><div class="week-header" id="weekHeader"></div><div class="week-body" id="weekBody"></div></div>
<div id="monthView" class="month-view"><div class="month-header" id="monthHeader"></div><div class="month-grid" id="monthGrid"></div></div>
</div>

<div id="eventModal" class="modal-overlay"><div class="modal"><h3 id="modalTitle">Add Event</h3><input type="text" id="eventTitle" placeholder="Event title"><select id="eventType"><option value="work">💼 Work</option><option value="personal">🏠 Personal</option><option value="meeting">👥 Meeting</option><option value="reminder">⏰ Reminder</option><option value="deadline">📅 Deadline</option></select><input type="datetime-local" id="eventStart"><input type="datetime-local" id="eventEnd"><textarea id="eventDescription" rows="3" placeholder="Description"></textarea><div class="reminder-checkbox"><input type="checkbox" id="enableReminder"><label>📧 Send email reminder</label></div><div id="reminderTimeDiv" class="reminder-time"><select id="reminderMinutes"><option value="5">5 minutes before</option><option value="15">15 minutes before</option><option value="30">30 minutes before</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select></div><div class="modal-buttons"><button class="modal-cancel" onclick="closeEventModal()">Cancel</button><button class="modal-save" onclick="saveEvent()">Save</button></div></div></div>

<footer>
<a href="dashboard.html" class="logo" style="font-size:18px">Sl<em>a</em>te</a>
<div class="footer-links"><a href="dashboard.html">Dashboard</a><a href="calendar.html">Calendar</a><a href="goals.html">Goals</a><a href="support.html">Support</a></div>
<div class="footer-copy">© 2026 Slate. All rights reserved.</div>
</footer>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/slate-app/sw.js')
      .then(registration => console.log('Service Worker registered:', registration))
      .catch(error => console.log('Service Worker registration failed:', error));
  });

</script>
</body>
</html>
