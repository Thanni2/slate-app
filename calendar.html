<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;--tag:#f0ede6;--danger:#ef4444;--purple:#8b5cf6;--orange:#f97316;--warning:#f59e0b;}
[data-theme="dark"]{--bg:#1a1a1a;--surface:#2d2d2d;--border:rgba(255,255,255,.1);--text:#e5e5e5;--muted:#9ca3af;--accent:#3b82f6;--tag:#3a3a3a;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);flex-wrap:wrap;gap:1rem;}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.user-info{display:flex;gap:1rem;align-items:center;}
.theme-toggle,.logout-btn{padding:6px 16px;background:var(--tag);border:.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text);}
.container{max-width:1400px;margin:0 auto;padding:2rem;flex:1;}
.tab-bar{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:1rem;flex-wrap:wrap;}
.tab-btn{background:none;border:none;padding:8px 20px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .2s;}
.tab-btn:hover{color:var(--text);background:var(--tag);}
.tab-btn.active{color:var(--accent);background:var(--tag);}
.calendar-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;}
.calendar-nav{display:flex;gap:.5rem;}
.calendar-nav button{padding:8px 16px;background:var(--surface);border:.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;}
.current-date{font-family:'DM Serif Display',serif;font-size:24px;}
.add-event-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;}
.week-view{background:var(--surface);border-radius:20px;border:.5px solid var(--border);overflow-x:auto;}
.week-header{display:grid;grid-template-columns:80px repeat(7,1fr);border-bottom:.5px solid var(--border);background:var(--tag);min-width:700px;}
.week-header-cell{padding:1rem;text-align:center;}
.week-header-day{font-weight:600;margin-bottom:4px;}
.week-body{display:flex;flex-direction:column;}
.week-row{display:grid;grid-template-columns:80px repeat(7,1fr);border-bottom:.5px solid var(--border);min-width:700px;}
.week-hour{padding:1rem;font-size:11px;color:var(--muted);text-align:right;border-right:.5px solid var(--border);background:var(--tag);}
.week-cell{min-height:80px;padding:4px;border-right:.5px solid var(--border);cursor:pointer;position:relative;}
.week-cell:hover{background:var(--tag);}
.month-view{display:none;background:var(--surface);border-radius:20px;border:.5px solid var(--border);overflow-x:auto;}
.month-header{display:grid;grid-template-columns:repeat(7,1fr);background:var(--tag);border-bottom:.5px solid var(--border);min-width:600px;}
.month-header-cell{padding:1rem;text-align:center;font-weight:500;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);min-width:600px;}
.month-day{min-height:120px;padding:8px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);cursor:pointer;position:relative;}
.month-day:hover{background:var(--tag);}
.month-day.other-month{background:rgba(0,0,0,.02);color:var(--muted);}
.month-day.today{background:rgba(37,99,235,.1);border:1px solid var(--accent);}
.day-number{font-size:14px;font-weight:500;margin-bottom:6px;}
.event-card{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center;}
.event-card.work{background:var(--accent);}
.event-card.personal{background:var(--purple);}
.event-card.meeting{background:var(--orange);}
.event-card.reminder{background:var(--warning);}
.event-card.deadline{background:var(--danger);}
.event-delete{background:rgba(0,0,0,0.3);color:#fff;border:none;border-radius:10px;padding:0 4px;margin-left:4px;cursor:pointer;font-size:8px;line-height:1;}
.event-delete:hover{background:rgba(0,0,0,0.6);}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border-radius:24px;padding:2rem;max-width:500px;width:90%;}
.modal h3{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:1rem;}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;margin:10px 0;border:.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.modal-buttons{display:flex;gap:1rem;margin-top:1rem;}
.modal-buttons button{flex:1;padding:12px;border-radius:12px;cursor:pointer;}
.modal-save{background:var(--accent);color:#fff;border:none;}
.modal-cancel{background:var(--surface);border:.5px solid var(--border);}
.reminder-checkbox{display:flex;align-items:center;gap:8px;margin:10px 0;}
.reminder-time{display:none;margin-top:8px;}
.reminder-time.active{display:block;}
.reminder-time select{width:100%;padding:10px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--text);}
footer{border-top:.5px solid var(--border);padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.footer-links{display:flex;gap:1.5rem;flex-wrap:wrap;}
.footer-links a{text-decoration:none;font-size:12px;color:var(--muted);}
@media(max-width:768px){.calendar-controls{flex-direction:column;align-items:stretch;}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<nav>
<a href="dashboard.html" class="logo">Sl<em>a</em>te</a>
<div class="user-info">
<span class="user-name" id="userNameDisplay">User</span>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
<button class="logout-btn" onclick="logout()">Sign out</button>
</div>
</nav>

<div class="container">
<div class="tab-bar">
<button class="tab-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
<button class="tab-btn active" onclick="window.location.href='calendar.html'">Calendar</button>
<button class="tab-btn" onclick="window.location.href='goals.html'">Goals</button>
<button class="tab-btn" onclick="window.location.href='support.html'">Support</button>
</div>

<div class="calendar-controls">
<div class="calendar-nav">
<button onclick="previousPeriod()">← Prev</button>
<button onclick="nextPeriod()">Next →</button>
<button onclick="goToToday()">Today</button>
<button onclick="switchView('week')" id="weekViewBtn" style="background:var(--accent);color:#fff;">Week</button>
<button onclick="switchView('month')" id="monthViewBtn">Month</button>
</div>
<div class="current-date" id="currentDateDisplay"></div>
<button class="add-event-btn" onclick="openAddEventModal()">+ Add Event</button>
</div>

<div id="weekView" class="week-view">
<div class="week-header" id="weekHeader"></div>
<div class="week-body" id="weekBody"></div>
</div>
<div id="monthView" class="month-view">
<div class="month-header" id="monthHeader"></div>
<div class="month-grid" id="monthGrid"></div>
</div>
</div>

<div id="eventModal" class="modal-overlay">
<div class="modal">
<h3 id="modalTitle">Add Event</h3>
<input type="text" id="eventTitle" placeholder="Event title">
<select id="eventType">
<option value="work">💼 Work</option>
<option value="personal">🏠 Personal</option>
<option value="meeting">👥 Meeting</option>
<option value="reminder">⏰ Reminder</option>
<option value="deadline">📅 Deadline</option>
</select>
<input type="datetime-local" id="eventStart">
<input type="datetime-local" id="eventEnd">
<textarea id="eventDescription" rows="3" placeholder="Description"></textarea>
<div class="reminder-checkbox">
<input type="checkbox" id="enableReminder">
<label>📧 Send email reminder</label>
</div>
<div id="reminderTimeDiv" class="reminder-time">
<select id="reminderMinutes">
<option value="5">5 minutes before</option>
<option value="15">15 minutes before</option>
<option value="30">30 minutes before</option>
<option value="60">1 hour before</option>
<option value="1440">1 day before</option>
</select>
</div>
<div class="modal-buttons">
<button class="modal-cancel" onclick="closeEventModal()">Cancel</button>
<button class="modal-save" onclick="saveEvent()">Save</button>
</div>
</div>
</div>

<footer>
<a href="dashboard.html" class="logo" style="font-size:18px">Sl<em>a</em>te</a>
<div class="footer-links">
<a href="dashboard.html">Dashboard</a>
<a href="calendar.html">Calendar</a>
<a href="goals.html">Goals</a>
<a href="support.html">Support</a>
</div>
<div class="footer-copy">© 2026 Slate. All rights reserved.</div>
</footer>

<script>
emailjs.init("SHYsSMG5uOmMQb99a");

const firebaseConfig = {
  apiKey: "AIzaSyBe-shv8pxkhnyiEGmpK9RG7MoO0NFYQfY",
  authDomain: "slate-app-a66f9.firebaseapp.com",
  projectId: "slate-app-a66f9",
  storageBucket: "slate-app-a66f9.firebasestorage.app",
  messagingSenderId: "683853322128",
  appId: "1:683853322128:web:ba3c8e4d7ee2c4f1494515",
  measurementId: "G-FZLN9YF0VW"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const EMAILJS_SERVICE_ID = "service_bawkmuw";
const EMAILJS_TEMPLATE_ID = "template_zw93q4s";

let currentUser = null;
let currentViewDate = new Date();
let currentView = 'week';
let editingEventId = null;
let events = [];
let reminderCheckInterval = null;

firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = 'login.html';
        return;
    }
    if (!user.emailVerified) {
        await firebase.auth().signOut();
        alert('Please verify your email.');
        window.location.href = 'login.html';
        return;
    }
    currentUser = user;
    document.getElementById('userNameDisplay').innerText = user.displayName?.split(' ')[0] || user.email.split('@')[0];
    
    await loadEvents();
    renderCalendar();
    startReminderChecker();
});

async function loadEvents() {
    if (!currentUser) return;
    const snapshot = await db.collection('users').doc(currentUser.uid).collection('events').get();
    events = [];
    snapshot.forEach(doc => {
        events.push({ id: doc.id, ...doc.data() });
    });
    renderCalendar();
}

async function saveEventToFirestore(event) {
    if (!currentUser) return;
    const { id, ...eventData } = event;
    await db.collection('users').doc(currentUser.uid).collection('events').doc(id).set(eventData);
}

async function deleteEventFromFirestore(eventId) {
    if (!currentUser) return;
    await db.collection('users').doc(currentUser.uid).collection('events').doc(eventId).delete();
}

async function deleteEvent(eventId) {
    if (confirm('Delete this event?')) {
        events = events.filter(e => e.id !== eventId);
        await deleteEventFromFirestore(eventId);
        renderCalendar();
    }
}

function startReminderChecker() {
    if (reminderCheckInterval) clearInterval(reminderCheckInterval);
    reminderCheckInterval = setInterval(checkReminders, 60000);
}

async function checkReminders() {
    if (!currentUser) return;
    const now = new Date();
    
    for (let event of events) {
        if (event.reminder && !event.reminder.sent) {
            const eventTime = new Date(event.start);
            const reminderTime = new Date(eventTime.getTime() - (event.reminder.minutes * 60000));
            
            if (now >= reminderTime && now < eventTime) {
                await sendEmailReminder(event, currentUser.email);
                event.reminder.sent = true;
                await saveEventToFirestore(event);
            }
        }
    }
}

async function sendEmailReminder(event, userEmail) {
    console.log("Sending to user email:", userEmail);
    
    const eventDate = new Date(event.start);
    const templateParams = {
        to_email: userEmail,
        event_title: event.title,
        event_date: eventDate.toLocaleDateString(),
        event_time: eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        event_description: event.description || 'No description'
    };
    
    try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
        console.log('Reminder sent for:', event.title);
        return true;
    } catch (error) {
        console.error('Failed to send reminder:', error);
        return false;
    }
}

function renderCalendar() {
    if (currentView === 'week') renderWeekView();
    else renderMonthView();
    updateDateDisplay();
    
    document.getElementById('weekViewBtn').style.background = currentView === 'week' ? 'var(--accent)' : 'var(--surface)';
    document.getElementById('weekViewBtn').style.color = currentView === 'week' ? '#fff' : 'var(--text)';
    document.getElementById('monthViewBtn').style.background = currentView === 'month' ? 'var(--accent)' : 'var(--surface)';
    document.getElementById('monthViewBtn').style.color = currentView === 'month' ? '#fff' : 'var(--text)';
}

function renderWeekView() {
    let start = new Date(currentViewDate);
    start.setDate(currentViewDate.getDate() - currentViewDate.getDay());
    
    let header = document.getElementById('weekHeader');
    header.innerHTML = '<div class="week-header-cell"></div>';
    for (let i = 0; i < 7; i++) {
        let day = new Date(start);
        day.setDate(start.getDate() + i);
        let isToday = day.toDateString() === new Date().toDateString();
        header.innerHTML += `<div class="week-header-cell"><div class="week-header-day">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][i]}</div><div style="font-size:20px;font-weight:600;${isToday ? 'color:var(--accent);' : ''}">${day.getDate()}</div></div>`;
    }
    
    let body = document.getElementById('weekBody');
    body.innerHTML = '';
    
    for (let hour = 0; hour < 24; hour++) {
        let row = document.createElement('div');
        row.className = 'week-row';
        row.innerHTML = `<div class="week-hour">${hour.toString().padStart(2, '0')}:00</div>`;
        
        for (let i = 0; i < 7; i++) {
            let day = new Date(start);
            day.setDate(start.getDate() + i);
            day.setHours(hour, 0, 0);
            
            let cell = document.createElement('div');
            cell.className = 'week-cell';
            cell.onclick = () => openAddEventModal(day);
            
            let dayEvents = events.filter(e => {
                let d = new Date(e.start);
                return d.toDateString() === day.toDateString() && d.getHours() === hour;
            });
            
            dayEvents.forEach(e => {
                let ev = document.createElement('div');
                ev.className = `event-card ${e.type}`;
                ev.innerHTML = `${e.title}<button class="event-delete" onclick="event.stopPropagation(); deleteEvent('${e.id}')">✕</button>`;
                ev.onclick = (evt) => {
                    if (evt.target.classList.contains('event-delete')) return;
                    evt.stopPropagation();
                    openEditEventModal(e);
                };
                cell.appendChild(ev);
            });
            row.appendChild(cell);
        }
        body.appendChild(row);
    }
}

function renderMonthView() {
    let year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
    let firstDay = new Date(year, month, 1), startDay = firstDay.getDay();
    let daysInMonth = new Date(year, month + 1, 0).getDate();
    let prevDays = new Date(year, month, 0).getDate();
    
    let header = document.getElementById('monthHeader');
    header.innerHTML = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="month-header-cell">${d}</div>`).join('');
    
    let grid = document.getElementById('monthGrid');
    grid.innerHTML = '';
    
    for (let i = 0; i < 42; i++) {
        let dayNum = i - startDay + 1;
        let isCurrent = dayNum > 0 && dayNum <= daysInMonth;
        let displayNum = isCurrent ? dayNum : (dayNum <= 0 ? prevDays + dayNum : dayNum - daysInMonth);
        
        let dayDiv = document.createElement('div');
        dayDiv.className = `month-day ${!isCurrent ? 'other-month' : ''}`;
        
        let today = new Date();
        if (isCurrent && dayNum === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
            dayDiv.classList.add('today');
        }
        
        dayDiv.onclick = () => { if (isCurrent) openAddEventModal(new Date(year, month, dayNum)); };
        dayDiv.innerHTML = `<div class="day-number">${displayNum}</div>`;
        
        if (isCurrent) {
            let dayEvents = events.filter(e => {
                let d = new Date(e.start);
                return d.getDate() === dayNum && d.getMonth() === month && d.getFullYear() === year;
            });
            
            dayEvents.slice(0, 3).forEach(e => {
                let ev = document.createElement('div');
                ev.className = `event-card ${e.type}`;
                ev.innerHTML = `${e.title.length > 15 ? e.title.slice(0, 12) + '...' : e.title}<button class="event-delete" onclick="event.stopPropagation(); deleteEvent('${e.id}')">✕</button>`;
                ev.onclick = (evt) => {
                    if (evt.target.classList.contains('event-delete')) return;
                    evt.stopPropagation();
                    openEditEventModal(e);
                };
                dayDiv.appendChild(ev);
            });
            
            if (dayEvents.length > 3) {
                let more = document.createElement('div');
                more.className = 'event-card';
                more.style.background = 'var(--muted)';
                more.innerHTML = `+${dayEvents.length - 3} more`;
                more.onclick = (evt) => {
                    evt.stopPropagation();
                    alert(dayEvents.map(e => `• ${e.title} (${e.type})`).join('\n'));
                };
                dayDiv.appendChild(more);
            }
        }
        grid.appendChild(dayDiv);
    }
}

function previousPeriod() {
    if (currentView === 'week') currentViewDate.setDate(currentViewDate.getDate() - 7);
    else currentViewDate.setMonth(currentViewDate.getMonth() - 1);
    renderCalendar();
}

function nextPeriod() {
    if (currentView === 'week') currentViewDate.setDate(currentViewDate.getDate() + 7);
    else currentViewDate.setMonth(currentViewDate.getMonth() + 1);
    renderCalendar();
}

function goToToday() {
    currentViewDate = new Date();
    renderCalendar();
}

function switchView(view) {
    currentView = view;
    document.getElementById('weekView').style.display = view === 'week' ? 'block' : 'none';
    document.getElementById('monthView').style.display = view === 'month' ? 'block' : 'none';
    renderCalendar();
}

function updateDateDisplay() {
    let el = document.getElementById('currentDateDisplay');
    if (currentView === 'week') {
        let start = new Date(currentViewDate);
        start.setDate(currentViewDate.getDate() - currentViewDate.getDay());
        let end = new Date(start);
        end.setDate(start.getDate() + 6);
        el.innerText = `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
    } else {
        el.innerText = currentViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }
}

function openAddEventModal(date = null) {
    editingEventId = null;
    document.getElementById('modalTitle').innerText = 'Add Event';
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventType').value = 'work';
    document.getElementById('eventDescription').value = '';
    document.getElementById('enableReminder').checked = false;
    document.getElementById('reminderTimeDiv').classList.remove('active');
    
    let now = new Date();
    now.setMinutes(0);
    let later = new Date(now);
    later.setHours(now.getHours() + 1);
    
    if (date) {
        let start = new Date(date);
        start.setHours(9, 0);
        let end = new Date(date);
        end.setHours(10, 0);
        document.getElementById('eventStart').value = start.toISOString().slice(0, 16);
        document.getElementById('eventEnd').value = end.toISOString().slice(0, 16);
    } else {
        document.getElementById('eventStart').value = now.toISOString().slice(0, 16);
        document.getElementById('eventEnd').value = later.toISOString().slice(0, 16);
    }
    
    document.getElementById('eventModal').classList.add('active');
}

function openEditEventModal(event) {
    editingEventId = event.id;
    document.getElementById('modalTitle').innerText = 'Edit Event';
    document.getElementById('eventTitle').value = event.title;
    document.getElementById('eventType').value = event.type;
    document.getElementById('eventDescription').value = event.description || '';
    document.getElementById('eventStart').value = event.start.slice(0, 16);
    document.getElementById('eventEnd').value = event.end.slice(0, 16);
    
    if (event.reminder) {
        document.getElementById('enableReminder').checked = true;
        document.getElementById('reminderTimeDiv').classList.add('active');
        document.getElementById('reminderMinutes').value = event.reminder.minutes;
    } else {
        document.getElementById('enableReminder').checked = false;
        document.getElementById('reminderTimeDiv').classList.remove('active');
    }
    
    document.getElementById('eventModal').classList.add('active');
}

function closeEventModal() {
    document.getElementById('eventModal').classList.remove('active');
    editingEventId = null;
}

async function saveEvent() {
    let title = document.getElementById('eventTitle').value.trim();
    if (!title) {
        alert('Enter event title');
        return;
    }
    
    let reminder = null;
    if (document.getElementById('enableReminder').checked) {
        reminder = {
            minutes: parseInt(document.getElementById('reminderMinutes').value),
            sent: false
        };
    }
    
    let eventData = {
        id: editingEventId || Date.now().toString(),
        title: title,
        type: document.getElementById('eventType').value,
        start: document.getElementById('eventStart').value,
        end: document.getElementById('eventEnd').value,
        description: document.getElementById('eventDescription').value,
        reminder: reminder
    };
    
    if (editingEventId) {
        let index = events.findIndex(e => e.id === editingEventId);
        if (index !== -1) events[index] = eventData;
    } else {
        events.push(eventData);
    }
    
    await saveEventToFirestore(eventData);
    closeEventModal();
    renderCalendar();
}

document.getElementById('enableReminder').addEventListener('change', function() {
    if (this.checked) {
        document.getElementById('reminderTimeDiv').classList.add('active');
    } else {
        document.getElementById('reminderTimeDiv').classList.remove('active');
    }
});

function logout() {
    firebase.auth().signOut();
    window.location.href = 'login.html';
}

function toggleTheme() {
    let theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('slate_theme', theme);
    document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
}

function loadTheme() {
    let saved = localStorage.getItem('slate_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeToggle').innerHTML = (saved === 'dark' ? '☀️ Light' : '🌙 Dark');
}
loadTheme();

window.previousPeriod = previousPeriod;
window.nextPeriod = nextPeriod;
window.goToToday = goToToday;
window.switchView = switchView;
window.openAddEventModal = openAddEventModal;
window.closeEventModal = closeEventModal;
window.saveEvent = saveEvent;
window.deleteEvent = deleteEvent;
window.logout = logout;
window.toggleTheme = toggleTheme;
</script>
