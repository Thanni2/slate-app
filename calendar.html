<script>
emailjs.init("SHYsSMG5uOmMQb99a");

const firebaseConfig = {
  apiKey: "AIzaSyBe-shv8pxkhnyiEGmpK9RG7MoO0NFYQfY",
  authDomain: "slate-app-a66f9.firebaseapp.com",
  projectId: "slate-app-a66f9",
  storageBucket: "slate-app-a66f9.firebasestorage.app",
  messagingSenderId: "683853322128",
  appId: "1:683853322128:web:ba3c8e4d7ee2c4f1494515",
  measurementId: "G-FZLN9YF0VW"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const EMAILJS_SERVICE_ID = "service_bawkmuw";
const EMAILJS_TEMPLATE_ID = "template_zw93q4s";

let currentUser = null;
let currentViewDate = new Date();
let currentView = 'week';
let editingEventId = null;
let events = [];
let reminderChecker = null;

firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!user.emailVerified) { await firebase.auth().signOut(); alert('Please verify your email.'); window.location.href = 'login.html'; return; }
    currentUser = user;
    document.getElementById('userNameDisplay').innerText = user.displayName?.split(' ')[0] || user.email.split('@')[0];
    await loadEvents();
    renderCalendar();
    startReminderChecker();
});

async function loadEvents() {
    if (!currentUser) return;
    const snapshot = await db.collection('users').doc(currentUser.uid).collection('events').get();
    events = [];
    snapshot.forEach(doc => { events.push({ id: doc.id, ...doc.data() }); });
    renderCalendar();
}

async function saveEventToFirestore(event) {
    if (!currentUser) return;
    const { id, ...eventData } = event;
    await db.collection('users').doc(currentUser.uid).collection('events').doc(id).set(eventData);
}

async function deleteEventFromFirestore(eventId) {
    if (!currentUser) return;
    await db.collection('users').doc(currentUser.uid).collection('events').doc(eventId).delete();
}

async function deleteEvent(eventId) {
    if (confirm('Delete this event?')) {
        events = events.filter(e => e.id !== eventId);
        await deleteEventFromFirestore(eventId);
        renderCalendar();
    }
}

function startReminderChecker() {
    if (reminderChecker) clearInterval(reminderChecker);
    reminderChecker = setInterval(checkAndSendReminders, 30000);
    console.log("✅ Reminder checker started");
}

async function checkAndSendReminders() {
    if (!currentUser) return;
    const now = new Date();
    for (let event of events) {
        if (event.reminder && !event.reminder.sent) {
            const eventTime = new Date(event.start);
            const reminderTime = new Date(eventTime.getTime() - (event.reminder.minutes * 60000));
            const diffMs = now - reminderTime;
            if (diffMs >= 0 && diffMs < 120000 && now < eventTime) {
                console.log(`🔔 Sending reminder for: ${event.title}`);
                await sendEmailReminder(event, currentUser.email, event.reminder.minutes);
                event.reminder.sent = true;
                await saveEventToFirestore(event);
            }
        }
    }
}

async function sendEmailReminder(event, userEmail, reminderMinutes) {
    const eventDate = new Date(event.start);
    let reminderText = "";
    if (reminderMinutes === 5) reminderText = "5 minutes before";
    else if (reminderMinutes === 15) reminderText = "15 minutes before";
    else if (reminderMinutes === 30) reminderText = "30 minutes before";
    else if (reminderMinutes === 60) reminderText = "1 hour before";
    else if (reminderMinutes === 1440) reminderText = "1 day before";
    const templateParams = {
        to_email: userEmail,
        event_title: event.title,
        event_date: eventDate.toLocaleDateString(),
        event_time: eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        event_description: event.description || 'No description',
        reminder_time: reminderText
    };
    try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
        console.log(`✅ Email sent to ${userEmail} for: ${event.title}`);
        return true;
    } catch (error) {
        console.error(`❌ Email failed:`, error);
        return false;
    }
}

// Calendar rendering functions (you already have them working, I'm including the essential ones)
function renderCalendar() {
    if (currentView === 'week') renderWeekView();
    else renderMonthView();
    updateDateDisplay();
    document.getElementById('weekViewBtn').style.background = currentView === 'week' ? 'var(--accent)' : 'var(--surface)';
    document.getElementById('weekViewBtn').style.color = currentView === 'week' ? '#fff' : 'var(--text)';
    document.getElementById('monthViewBtn').style.background = currentView === 'month' ? 'var(--accent)' : 'var(--surface)';
    document.getElementById('monthViewBtn').style.color = currentView === 'month' ? '#fff' : 'var(--text)';
}

function renderWeekView() { /* your existing week view rendering code */ }
function renderMonthView() { /* your existing month view rendering code */ }
function previousPeriod() { if (currentView === 'week') currentViewDate.setDate(currentViewDate.getDate() - 7); else currentViewDate.setMonth(currentViewDate.getMonth() - 1); renderCalendar(); }
function nextPeriod() { if (currentView === 'week') currentViewDate.setDate(currentViewDate.getDate() + 7); else currentViewDate.setMonth(currentViewDate.getMonth() + 1); renderCalendar(); }
function goToToday() { currentViewDate = new Date(); renderCalendar(); }
function switchView(view) { currentView = view; document.getElementById('weekView').style.display = view === 'week' ? 'block' : 'none'; document.getElementById('monthView').style.display = view === 'month' ? 'block' : 'none'; renderCalendar(); }
function updateDateDisplay() { /* your existing code */ }

function openAddEventModal(date) { /* your existing code */ }
function openEditEventModal(event) { /* your existing code */ }
function closeEventModal() { document.getElementById('eventModal').classList.remove('active'); editingEventId = null; }

async function saveEvent() {
    let title = document.getElementById('eventTitle').value.trim();
    if (!title) { alert('Enter event title'); return; }
    let reminder = null;
    if (document.getElementById('enableReminder').checked) {
        reminder = { minutes: parseInt(document.getElementById('reminderMinutes').value), sent: false };
    }
    let eventData = {
        id: editingEventId || Date.now().toString(),
        title: title,
        type: document.getElementById('eventType').value,
        start: document.getElementById('eventStart').value,
        end: document.getElementById('eventEnd').value,
        description: document.getElementById('eventDescription').value,
        reminder: reminder
    };
    if (editingEventId) {
        let index = events.findIndex(e => e.id === editingEventId);
        if (index !== -1) events[index] = eventData;
    } else {
        events.push(eventData);
    }
    await saveEventToFirestore(eventData);
    closeEventModal();
    renderCalendar();
}

document.getElementById('enableReminder').addEventListener('change', function() {
    if (this.checked) document.getElementById('reminderTimeDiv').classList.add('active');
    else document.getElementById('reminderTimeDiv').classList.remove('active');
});

function logout() { firebase.auth().signOut(); window.location.href = 'login.html'; }
function toggleTheme() { let t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); localStorage.setItem('slate_theme', t); document.getElementById('themeToggle').innerHTML = t === 'dark' ? '☀️ Light' : '🌙 Dark'; }
function loadTheme() { let s = localStorage.getItem('slate_theme'); if (s) document.documentElement.setAttribute('data-theme', s); document.getElementById('themeToggle').innerHTML = (s === 'dark' ? '☀️ Light' : '🌙 Dark'); }
loadTheme();

window.previousPeriod = previousPeriod;
window.nextPeriod = nextPeriod;
window.goToToday = goToToday;
window.switchView = switchView;
window.openAddEventModal = openAddEventModal;
window.closeEventModal = closeEventModal;
window.saveEvent = saveEvent;
window.deleteEvent = deleteEvent;
window.logout = logout;
window.toggleTheme = toggleTheme;
</script>
