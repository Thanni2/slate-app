<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.nav-links{display:flex;gap:1.5rem;}
.nav-links a{text-decoration:none;font-size:13px;color:var(--muted);}
.container{max-width:480px;width:100%;margin:auto;padding:2rem;}
.card{background:var(--surface);border-radius:24px;border:.5px solid var(--border);padding:2rem;}
h1{font-family:'DM Serif Display',serif;font-size:28px;text-align:center;margin-bottom:.5rem;}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:1.5rem;}
.form-group{margin-bottom:1rem;}
label{display:block;font-size:13px;font-weight:500;margin-bottom:.5rem;}
input{width:100%;padding:12px 16px;border:.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);}
input:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-top:.5rem;}
.btn:hover{opacity:.88;}
.btn-google{width:100%;padding:12px;background:var(--surface);color:var(--text);border:.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{background:var(--tag);}
.divider{text-align:center;margin:1.5rem 0;position:relative;}
.divider::before{content:'';position:absolute;top:50%;left:0;width:45%;height:.5px;background:var(--border);}
.divider::after{content:'';position:absolute;top:50%;right:0;width:45%;height:.5px;background:var(--border);}
.divider span{background:var(--surface);padding:0 10px;color:var(--muted);font-size:12px;}
.error-msg{color:#ef4444;font-size:12px;text-align:center;margin-top:1rem;display:none;}
.success-msg{color:#10b981;font-size:12px;text-align:center;margin-top:1rem;display:none;}
.links{text-align:center;margin-top:1.5rem;}
.links a{color:var(--muted);text-decoration:none;font-size:13px;}
.loading{opacity:0.6;pointer-events:none;}
footer{border-top:.5px solid var(--border);padding:1.5rem 2rem;text-align:center;margin-top:auto;}
.footer-links{display:flex;justify-content:center;gap:1.5rem;margin-bottom:.5rem;}
.footer-links a{text-decoration:none;font-size:12px;color:var(--muted);}

/* Mobile fixes */
@media (max-width: 768px) {
    .btn-google {
        display: flex !important;
    }
    .divider {
        display: block !important;
    }
    .card {
        padding: 1.5rem !important;
    }
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>
<body>

<!-- ============================================ -->
<!-- ONE-TIME FORCE UPDATE - Remove this after 1 week -->
<!-- ============================================ -->
<script>
const APP_VERSION = '3';
if (localStorage.getItem('app_version') !== APP_VERSION) {
  console.log('🔄 Running one-time cache cleanup...');
  
  if ('caches' in window) {
    caches.keys().then(keys => {
      keys.forEach(key => caches.delete(key));
    });
  }
  
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      registrations.forEach(reg => reg.unregister());
    });
  }
  
  localStorage.setItem('app_version', APP_VERSION);
  
  setTimeout(() => {
    location.reload(true);
  }, 500);
}
</script>
<!-- ============================================ -->

<nav>
<a href="index.html" class="logo">Sl<em>a</em>te</a>
<div class="nav-links">
<a href="index.html#features">Features</a>
<a href="index.html#pricing">Pricing</a>
<a href="support.html">Support</a>
<a href="login.html">Sign in</a>
</div>
</nav>

<div class="container">
<div class="card">
<h1>Create account</h1>
<p class="subtitle">Join Slate to start planning your days</p>

<div class="form-group"><label>Full name</label><input type="text" id="fullname" placeholder="Mobolaji Adewale"></div>
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="hello@example.com"></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Create a password (min 6 chars)"></div>

<button class="btn" id="signupBtn" onclick="signUp()">Create account →</button>

<div class="divider"><span>or</span></div>

<button class="btn-google" id="googleBtn" style="display:flex !important; visibility:visible !important; width:100%;">
<svg width="20" height="20" viewBox="0 0 24 24">
<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
</svg>
Continue with Google
</button>

<div id="errorMsg" class="error-msg"></div>
<div id="successMsg" class="success-msg"></div>

<div class="links"><a href="login.html">Already have an account? Sign in</a><span>•</span><a href="index.html">← Back to home</a></div>
</div></div>

<footer><div class="footer-links"><a href="index.html">Home</a><a href="login.html">Sign in</a><a href="support.html">Support</a></div><div class="footer-copy">© 2026 Slate. All rights reserved.</div></footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe-shv8pxkhnyiEGmpK9RG7MoO0NFYQfY",
  authDomain: "slate-app-a66f9.firebaseapp.com",
  projectId: "slate-app-a66f9",
  storageBucket: "slate-app-a66f9.firebasestorage.app",
  messagingSenderId: "683853322128",
  appId: "1:683853322128:web:ba3c8e4d7ee2c4f1494515",
  measurementId: "G-FZLN9YF0VW"
};
firebase.initializeApp(firebaseConfig);

// Google Sign Up
document.getElementById('googleBtn').addEventListener('click', async function() {
    console.log("Google button clicked");
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    
    try {
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;
        console.log("Google sign in success:", user.email);
        
        localStorage.setItem('slate_user', JSON.stringify({
            name: user.displayName,
            email: user.email,
            uid: user.uid
        }));
        
        window.location.href = 'dashboard.html';
    } catch (error) {
        console.error("Google sign in error:", error);
        document.getElementById('errorMsg').innerText = error.message;
        document.getElementById('errorMsg').style.display = 'block';
    }
});

// Email/Password Sign Up
async function signUp() {
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    const errorEl = document.getElementById('errorMsg');
    const successEl = document.getElementById('successMsg');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    
    if (!name || !email || !password) {
        errorEl.innerText = 'Please fill in all fields';
        errorEl.style.display = 'block';
        return;
    }
    if (password.length < 6) {
        errorEl.innerText = 'Password must be at least 6 characters';
        errorEl.style.display = 'block';
        return;
    }
    
    const btn = document.getElementById('signupBtn');
    btn.innerText = 'Creating account...';
    btn.classList.add('loading');
    
    try {
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        await user.updateProfile({ displayName: name });
        await user.sendEmailVerification();
        
        successEl.innerText = 'Account created! Please check your email to verify your account. Redirecting to login...';
        successEl.style.display = 'block';
        
        await firebase.auth().signOut();
        
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 3000);
        
    } catch (error) {
        console.error('Signup error:', error);
        let message = error.message;
        if (message.includes('email-already-in-use')) {
            message = 'Email already registered. Please sign in instead.';
        } else if (message.includes('invalid-email')) {
            message = 'Please enter a valid email address.';
        } else if (message.includes('weak-password')) {
            message = 'Password is too weak. Use at least 6 characters.';
        }
        errorEl.innerText = message;
        errorEl.style.display = 'block';
    } finally {
        btn.innerText = 'Create account →';
        btn.classList.remove('loading');
    }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/slate-app/sw.js')
      .then(registration => console.log('Service Worker registered:', registration))
      .catch(error => console.log('Service Worker registration failed:', error));
  });
}
</script>
