<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.nav-links{display:flex;gap:1.5rem;}
.nav-links a{text-decoration:none;font-size:13px;color:var(--muted);}
.nav-links a:hover{color:var(--text);}
.signup-container{max-width:480px;width:100%;margin:auto;padding:2rem;}
.card{background:var(--surface);border-radius:24px;border:.5px solid var(--border);padding:2.5rem;}
h1{font-family:'DM Serif Display',serif;font-size:28px;text-align:center;margin-bottom:.5rem;}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:2rem;}
.form-group{margin-bottom:1.25rem;}
label{display:block;font-size:13px;font-weight:500;margin-bottom:.5rem;}
input{width:100%;padding:12px 16px;border:.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);}
input:focus{outline:none;border-color:var(--accent);}
.btn-signup{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-top:.5rem;}
.btn-signup:hover{opacity:.88;}
.success-msg{background:#10b981;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:1rem;display:none;}
.error-msg{color:#ef4444;font-size:12px;text-align:center;margin-top:1rem;display:none;}
.links{text-align:center;margin-top:1.5rem;}
.links a{color:var(--muted);text-decoration:none;font-size:13px;}
.links a:hover{color:var(--accent);}
.links span{margin:0 8px;}
footer{border-top:.5px solid var(--border);padding:1.5rem 2rem;text-align:center;margin-top:auto;}
.footer-links{display:flex;justify-content:center;gap:1.5rem;margin-bottom:.5rem;}
.footer-links a{text-decoration:none;font-size:12px;color:var(--muted);}
.footer-copy{font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<nav>
<a href="index.html" class="logo">Sl<em>a</em>te</a>
<div class="nav-links">
<a href="index.html#features">Features</a>
<a href="index.html#pricing">Pricing</a>
<a href="support.html">Support</a>
<a href="login.html">Sign in</a>
</div>
</nav>

<div class="signup-container">
<div class="card">
<h1>Create account</h1>
<p class="subtitle">Start planning your days with clarity</p>
<form id="signupForm">
<div class="form-group"><label>Full name</label><input type="text" id="fullname" required placeholder="Mobolaji Adewale"></div>
<div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="hello@example.com"></div>
<div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="Create a password"></div>
<button type="submit" class="btn-signup">Create account →</button>
<div id="successMsg" class="success-msg"></div>
<div id="errorMsg" class="error-msg"></div>
</form>
<div class="links">
<a href="login.html">Already have an account? Sign in</a><span>•</span><a href="index.html">← Back to home</a>
</div>
</div>
</div>

<footer>
<div class="footer-links"><a href="index.html">Home</a><a href="login.html">Sign in</a><a href="support.html">Support</a><a href="#">Privacy</a><a href="#">Terms</a></div>
<div class="footer-copy">© 2026 Slate. All rights reserved.</div>
</footer>

<script>
document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    // Validation
    if (!name || !email || !password) {
        document.getElementById('errorMsg').innerText = 'Please fill in all fields';
        document.getElementById('errorMsg').style.display = 'block';
        return;
    }
    
    if (password.length < 6) {
        document.getElementById('errorMsg').innerText = 'Password must be at least 6 characters';
        document.getElementById('errorMsg').style.display = 'block';
        return;
    }
    
    // Get existing users
    const users = JSON.parse(localStorage.getItem('slate_users') || '[]');
    
    // Check if email already exists
    if (users.some(u => u.email === email)) {
        document.getElementById('errorMsg').innerText = 'Email already registered. Please sign in instead.';
        document.getElementById('errorMsg').style.display = 'block';
        
        // Redirect to login after 2 seconds
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 2000);
        return;
    }
    
    // Create new user
    const newUser = {
        name: name,
        email: email,
        password: password,
        joined: new Date().toISOString()
    };
    
    users.push(newUser);
    localStorage.setItem('slate_users', JSON.stringify(users));
    
    // Show success message
    document.getElementById('successMsg').innerHTML = '✓ Account created successfully! Redirecting to login...';
    document.getElementById('successMsg').style.display = 'block';
    
    // Clear form
    document.getElementById('signupForm').reset();
    
    // Redirect to login page after 2 seconds
    setTimeout(() => {
        window.location.href = 'login.html';
    }, 2000);
});
</script>
</body>
</html>
