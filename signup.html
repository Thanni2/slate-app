<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.nav-links{display:flex;gap:1.5rem;}
.nav-links a{text-decoration:none;font-size:13px;color:var(--muted);}
.container{max-width:480px;width:100%;margin:auto;padding:2rem;}
.card{background:var(--surface);border-radius:24px;border:.5px solid var(--border);padding:2rem;}
h1{font-family:'DM Serif Display',serif;font-size:28px;text-align:center;margin-bottom:.5rem;}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:1.5rem;}
.form-group{margin-bottom:1rem;}
label{display:block;font-size:13px;font-weight:500;margin-bottom:.5rem;}
input{width:100%;padding:12px 16px;border:.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);}
input:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-top:.5rem;}
.btn:hover{opacity:.88;}
.error-msg{color:#ef4444;font-size:12px;text-align:center;margin-top:1rem;display:none;}
.success-msg{color:#10b981;font-size:12px;text-align:center;margin-top:1rem;display:none;}
.links{text-align:center;margin-top:1.5rem;}
.links a{color:var(--muted);text-decoration:none;font-size:13px;}
.loading{opacity:0.6;pointer-events:none;}
footer{border-top:.5px solid var(--border);padding:1.5rem 2rem;text-align:center;margin-top:auto;}
.footer-links{display:flex;justify-content:center;gap:1.5rem;margin-bottom:.5rem;}
.footer-links a{text-decoration:none;font-size:12px;color:var(--muted);}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>
<body>
<nav>
<a href="index.html" class="logo">Sl<em>a</em>te</a>
<div class="nav-links">
<a href="index.html#features">Features</a>
<a href="index.html#pricing">Pricing</a>
<a href="support.html">Support</a>
<a href="login.html">Sign in</a>
</div>
</nav>

<div class="container">
<div class="card">
<h1>Create account</h1>
<p class="subtitle">Join Slate to start planning your days</p>

<div id="stepSignup">
<div class="form-group"><label>Full name</label><input type="text" id="fullname" placeholder="Mobolaji Adewale"></div>
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="hello@example.com"></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Create a password (min 6 chars)"></div>
<button class="btn" id="signupBtn" onclick="signUp()">Create account →</button>
<div id="errorMsg" class="error-msg"></div>
<div id="successMsg" class="success-msg"></div>
</div>

<div class="links"><a href="login.html">Already have an account? Sign in</a><span>•</span><a href="index.html">← Back to home</a></div>
</div></div>

<footer><div class="footer-links"><a href="index.html">Home</a><a href="login.html">Sign in</a><a href="support.html">Support</a></div><div class="footer-copy">© 2026 Slate. All rights reserved.</div></footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe-shv8pxkhnyiEGmpK9RG7MoO0NFYQfY",
  authDomain: "slate-app-a66f9.firebaseapp.com",
  projectId: "slate-app-a66f9",
  storageBucket: "slate-app-a66f9.firebasestorage.app",
  messagingSenderId: "683853322128",
  appId: "1:683853322128:web:ba3c8e4d7ee2c4f1494515",
  measurementId: "G-FZLN9YF0VW"
};
firebase.initializeApp(firebaseConfig);

async function signUp() {
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    const errorEl = document.getElementById('errorMsg');
    const successEl = document.getElementById('successMsg');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    
    if (!name || !email || !password) {
        errorEl.innerText = 'Please fill in all fields';
        errorEl.style.display = 'block';
        return;
    }
    if (password.length < 6) {
        errorEl.innerText = 'Password must be at least 6 characters';
        errorEl.style.display = 'block';
        return;
    }
    
    const btn = document.getElementById('signupBtn');
    btn.innerText = 'Creating account...';
    btn.classList.add('loading');
    
    try {
        // Create user in Firebase Auth
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Update profile with display name
        await user.updateProfile({ displayName: name });
        
        // Send email verification
        await user.sendEmailVerification();
        
        successEl.innerText = 'Account created! Please check your email to verify your account. Redirecting to login...';
        successEl.style.display = 'block';
        
        // Sign out immediately (user must verify email first)
        await firebase.auth().signOut();
        
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 3000);
        
    } catch (error) {
        console.error('Signup error:', error);
        let message = error.message;
        if (message.includes('email-already-in-use')) {
            message = 'Email already registered. Please sign in instead.';
        } else if (message.includes('invalid-email')) {
            message = 'Please enter a valid email address.';
        } else if (message.includes('weak-password')) {
            message = 'Password is too weak. Use at least 6 characters.';
        }
        errorEl.innerText = message;
        errorEl.style.display = 'block';
    } finally {
        btn.innerText = 'Create account →';
        btn.classList.remove('loading');
    }
}
</script>
    <script>
// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/slate-app/sw.js')
      .then(registration => {
        console.log('Service Worker registered:', registration);
      })
      .catch(error => {
        console.log('Service Worker registration failed:', error);
      });
  });
}
</script>
</body>
</html>
