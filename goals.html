<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Your existing goals CSS - keep as is */
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;--tag:#f0ede6;--danger:#ef4444;}
[data-theme="dark"]{--bg:#1a1a1a;--surface:#2d2d2d;--border:rgba(255,255,255,.1);--text:#e5e5e5;--muted:#9ca3af;--accent:#3b82f6;--tag:#3a3a3a;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);flex-wrap:wrap;gap:1rem;}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.user-info{display:flex;gap:1rem;align-items:center;}
.theme-toggle,.logout-btn{padding:6px 16px;background:var(--tag);border:.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text);}
.container{max-width:1000px;margin:0 auto;padding:2rem;flex:1;}
.tab-bar{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:1rem;flex-wrap:wrap;}
.tab-btn{background:none;border:none;padding:8px 20px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .2s;}
.tab-btn:hover{color:var(--text);background:var(--tag);}
.tab-btn.active{color:var(--accent);background:var(--tag);}
.goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.goal-header h1{font-family:'DM Serif Display',serif;font-size:32px;}
.add-goal-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:500;}
.goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem;}
.goal-card{background:var(--surface);border-radius:20px;border:.5px solid var(--border);padding:1.5rem;}
.goal-title{font-size:18px;font-weight:600;margin-bottom:.25rem;}
.goal-category{font-size:11px;color:var(--muted);margin-bottom:1rem;}
.progress-bar{background:var(--tag);border-radius:10px;height:10px;overflow:hidden;margin:1rem 0;}
.progress-fill{background:var(--accent);height:100%;transition:width .3s;}
.progress-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:1rem;}
.progress-controls{display:flex;flex-direction:column;gap:12px;margin:1rem 0;}
.slider-container{display:flex;align-items:center;gap:12px;}
.slider-container input[type="range"]{flex:1;height:4px;-webkit-appearance:none;background:var(--tag);border-radius:5px;}
.slider-container input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;}
.number-input{display:flex;align-items:center;gap:8px;}
.number-input input{width:80px;padding:8px;border:.5px solid var(--border);border-radius:8px;text-align:center;font-size:13px;background:var(--surface);color:var(--text);}
.button-group{display:flex;gap:8px;margin-top:8px;}
.button-group button{flex:1;padding:8px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;}
.button-group button.danger{color:var(--danger);}
.empty-state{text-align:center;padding:4rem;color:var(--muted);}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:1000;}
.modal.active{display:flex;}
.modal-content{background:var(--surface);border-radius:24px;padding:2rem;max-width:500px;width:90%;}
.modal-content input,.modal-content select{width:100%;padding:12px;margin:1rem 0;border:.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.modal-buttons{display:flex;gap:1rem;margin-top:1rem;}
.modal-buttons button{flex:1;padding:12px;border-radius:12px;cursor:pointer;}
.save-btn{background:var(--accent);color:#fff;border:none;}
.cancel-btn{background:var(--surface);border:.5px solid var(--border);}
footer{border-top:.5px solid var(--border);padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.footer-links{display:flex;gap:1.5rem;flex-wrap:wrap;}
.footer-links a{text-decoration:none;font-size:12px;color:var(--muted);}
@media(max-width:680px){.goals-grid{grid-template-columns:1fr;} .container{padding:1rem;}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ONE-TIME FORCE UPDATE -->
<script>
const APP_VERSION = '3';
if (localStorage.getItem('app_version') !== APP_VERSION) {
  if ('caches' in window) { caches.keys().then(keys => keys.forEach(key => caches.delete(key))); }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
  }
  localStorage.setItem('app_version', APP_VERSION);
  setTimeout(() => location.reload(true), 100);
}
</script>

<nav>
<a href="dashboard.html" class="logo">Sl<em>a</em>te</a>
<div class="user-info">
<span class="user-name" id="userNameDisplay">User</span>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
<button class="logout-btn" onclick="logout()">Sign out</button>
</div>
</nav>

<div class="container">
<div class="tab-bar">
<button class="tab-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
<button class="tab-btn active" onclick="window.location.href='goals.html'">Goals</button>
<button class="tab-btn" onclick="window.location.href='support.html'">Support</button>
</div>
<div class="goal-header"><h1>🎯 Your Goals</h1><button class="add-goal-btn" onclick="openModal()">+ New Goal</button></div>
<div id="goalsGrid" class="goals-grid"></div>
</div>

<div id="goalModal" class="modal"><div class="modal-content"><h3>Set a New Goal</h3><input type="text" id="goalTitle" placeholder="Goal title"><select id="goalCategory"><option value="Career">Career</option><option value="Health">Health</option><option value="Learning">Learning</option><option value="Personal">Personal</option><option value="Fitness">Fitness</option><option value="Finance">Finance</option></select><input type="number" id="goalTarget" placeholder="Target (e.g., 100)"><div class="modal-buttons"><button class="save-btn" onclick="saveGoal()">Save Goal</button><button class="cancel-btn" onclick="closeModal()">Cancel</button></div></div></div>

<footer>
<a href="dashboard.html" class="logo" style="font-size:18px">Sl<em>a</em>te</a>
<div class="footer-links"><a href="dashboard.html">Dashboard</a><a href="support.html">Support</a><a href="#">Privacy</a><a href="#">Terms</a></div>
<div class="footer-copy">© 2026 Slate. All rights reserved.</div>
</footer>

<script>
// Your existing goals JavaScript (the working one)
// Include Firebase config, loadGoals, saveGoal, etc.
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/slate-app/sw.js')
      .then(registration => console.log('Service Worker registered:', registration))
      .catch(error => console.log('Service Worker registration failed:', error));
  });
}
</script>
</body>
</html>
