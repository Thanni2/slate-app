<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Slate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Your existing dashboard CSS - keep as is */
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f7f6f3;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a18;--muted:#9a9890;--accent:#2563eb;--tag:#f0ede6;--danger:#ef4444;--purple:#8b5cf6;--orange:#f97316;--warning:#f59e0b;--success:#10b981;}
[data-theme="dark"]{--bg:#1a1a1a;--surface:#2d2d2d;--border:rgba(255,255,255,.1);--text:#e5e5e5;--muted:#9ca3af;--accent:#3b82f6;--tag:#3a3a3a;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s;}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--bg);border-bottom:.5px solid var(--border);flex-wrap:wrap;gap:1rem;}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-decoration:none;color:var(--text);}
.logo em{color:var(--accent);font-style:normal;}
.user-info{display:flex;gap:1rem;align-items:center;}
.theme-toggle,.logout-btn{padding:6px 16px;background:var(--tag);border:.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text);}
.container{max-width:1400px;margin:0 auto;padding:2rem;}
.welcome-banner{background:linear-gradient(135deg,var(--accent),#1e40af);border-radius:20px;padding:1.5rem 2rem;color:#fff;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.welcome-banner h1{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:.5rem;}
.weather-widget{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 20px;text-align:center;min-width:150px;}
.weather-temp{font-size:24px;font-weight:700;}
.weather-city{font-size:12px;opacity:0.9;}
.tab-bar{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:1rem;flex-wrap:wrap;}
.tab-btn{background:none;border:none;padding:8px 20px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .2s;}
.tab-btn:hover{color:var(--text);background:var(--tag);}
.tab-btn.active{color:var(--accent);background:var(--tag);}
.date-nav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1.5rem;}
.date-nav button{padding:8px 20px;background:var(--surface);border:.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;}
.date-nav button.today-btn{background:var(--accent);color:#fff;border:none;}
.current-date-display{font-family:'DM Serif Display',serif;font-size:20px;font-weight:500;min-width:200px;text-align:center;}
.search-section{background:var(--surface);border-radius:20px;border:.5px solid var(--border);padding:1rem;margin-bottom:1.5rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;}
.search-input{flex:1;padding:12px 16px;border:.5px solid var(--border);border-radius:12px;font-size:14px;background:var(--surface);color:var(--text);}
.search-btn{padding:12px 24px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;}
.search-results{background:var(--surface);border-radius:20px;border:.5px solid var(--border);padding:1.5rem;margin-bottom:1.5rem;display:none;max-height:400px;overflow-y:auto;}
.search-results h4{margin-bottom:1rem;color:var(--accent);}
.search-item{padding:12px;border-bottom:.5px solid var(--border);}
.search-item-date{font-size:11px;color:var(--muted);margin-bottom:4px;}
.search-item-text{font-size:13px;}
.search-item-type{display:inline-block;font-size:10px;padding:2px 8px;border-radius:12px;margin-right:8px;}
.search-item-type.task{background:var(--accent);color:#fff;}
.search-item-type.habit{background:var(--purple);color:#fff;}
.search-item-type.dump{background:var(--orange);color:#fff;}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
.card{background:var(--surface);border-radius:20px;border:.5px solid var(--border);padding:1.5rem;}
.card h3{font-size:16px;font-weight:600;margin-bottom:1rem;}
.todo-list{list-style:none;max-height:300px;overflow-y:auto;}
.todo-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--border);}
.todo-item input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}
.todo-item label{flex:1;font-size:13px;cursor:pointer;}
.todo-item.completed label{text-decoration:line-through;color:var(--muted);}
.delete-todo{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:14px;}
.delete-todo:hover{color:var(--danger);background:var(--tag);}
.add-todo{display:flex;gap:8px;margin-top:12px;}
.add-todo input{flex:1;padding:10px;border:.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);}
.add-todo button{padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;}
.habit-tracker{display:flex;flex-direction:column;gap:12px;max-height:300px;overflow-y:auto;}
.habit-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--tag);border-radius:12px;}
.habit-name{flex:1;font-size:13px;}
.habit-check{width:20px;height:20px;cursor:pointer;accent-color:var(--accent);margin:0 12px;}
.delete-habit{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:14px;}
.delete-habit:hover{color:var(--danger);background:var(--surface);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
.stat-card{text-align:center;padding:1rem;background:var(--tag);border-radius:14px;}
.stat-number{font-size:32px;font-weight:700;color:var(--accent);}
.stat-label{font-size:11px;color:var(--muted);margin-top:6px;}
.streak-badge{text-align:center;padding:12px;background:rgba(37,99,235,.1);border-radius:12px;font-size:13px;margin-top:1rem;}
.empty-state{text-align:center;padding:2rem;color:var(--muted);}
.brain-dump-container{display:flex;flex-direction:column;gap:1.5rem;}
.dump-input-area{background:var(--surface);border-radius:20px;border:.5px solid var(--border);padding:1.5rem;}
.dump-input-area textarea{width:100%;padding:12px;border:.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);resize:vertical;margin-bottom:1rem;}
.dump-actions{display:flex;gap:1rem;justify-content:flex-end;}
.dump-save{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;}
.dump-list{background:var(--surface);border-radius:20px;border:.5px solid var(--border);padding:1.5rem;}
.dump-item{background:var(--tag);border-radius:12px;padding:1rem;margin-bottom:1rem;}
.dump-text{font-size:14px;line-height:1.5;margin-bottom:1rem;}
.dump-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
.dump-buttons button{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;}
.dump-convert{color:var(--accent);}
.dump-delete{color:var(--danger);}
.share-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:2000;}
.share-modal-overlay.active{display:flex;}
.share-card{background:var(--surface);border-radius:28px;padding:2rem;max-width:600px;width:90%;}
.share-card-preview{background:#fff;border-radius:24px;padding:2rem;margin-bottom:1.5rem;text-align:center;}
.share-card-text{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.4;margin-bottom:1rem;}
.share-card-meta{font-size:12px;color:#666;margin-top:1rem;}
.download-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:500;}
@media(max-width:900px){.dashboard-grid{grid-template-columns:1fr;}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

<!-- ONE-TIME FORCE UPDATE -->
<script>
const APP_VERSION = '3';
if (localStorage.getItem('app_version') !== APP_VERSION) {
  if ('caches' in window) { caches.keys().then(keys => keys.forEach(key => caches.delete(key))); }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
  }
  localStorage.setItem('app_version', APP_VERSION);
  setTimeout(() => location.reload(true), 100);
}
</script>

<nav>
<a href="dashboard.html" class="logo">Sl<em>a</em>te</a>
<div class="user-info">
<span class="user-name" id="userNameDisplay">User</span>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
<button class="logout-btn" onclick="logout()">Sign out</button>
</div>
</nav>
<div class="container">
<div class="welcome-banner">
<div><h1 id="welcomeMessage">Welcome to Slate ✨</h1><p id="bannerSub">Track tasks, build habits, and stay productive.</p></div>
<div class="weather-widget" id="weatherWidget"><div class="weather-temp">--°C</div><div class="weather-city">Loading weather...</div></div>
</div>

<div class="tab-bar">
<button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
<button class="tab-btn" onclick="switchTab('calendar')">Calendar</button>
<button class="tab-btn" onclick="switchTab('braindump')">Brain Dump</button>
<button class="tab-btn" onclick="window.location.href='goals.html'">Goals</button>
<button class="tab-btn" onclick="window.location.href='support.html'">Support</button>
</div>

<div class="search-section">
<input type="text" class="search-input" id="searchInput" placeholder="Search past tasks, habits, or brain dumps...">
<button class="search-btn" onclick="performSearch()">🔍 Search</button>
</div>
<div class="search-results" id="searchResults"><h4>Search Results</h4><div id="searchResultsList"></div></div>

<div id="dashboardTab">
<div class="date-nav">
<button onclick="changeDate(-1)">← Previous Day</button>
<div class="current-date-display" id="dashboardDateDisplay"></div>
<button class="today-btn" onclick="goToTodayDashboard()">Today</button>
<button onclick="changeDate(1)">Next Day →</button>
</div>
<div class="dashboard-grid">
<div class="card"><h3>📋 <span id="tasksHeader">Today's Tasks</span></h3><ul class="todo-list" id="todoList"></ul><div class="add-todo"><input type="text" id="newTodoInput" placeholder="Add a task..." onkeypress="if(event.key==='Enter') addTodo()"><button onclick="addTodo()">Add</button></div></div>
<div class="card"><h3>✅ <span id="habitsHeader">Today's Habits</span></h3><div class="habit-tracker" id="habitTracker"></div><div class="add-todo" style="margin-top:12px;"><input type="text" id="newHabitInput" placeholder="Add a habit..." onkeypress="if(event.key==='Enter') addHabit()"><button onclick="addHabit()">Add</button></div></div>
<div class="card"><h3>📊 Your Progress</h3><div class="stats-grid"><div class="stat-card"><div class="stat-number" id="tasksCompleted">0</div><div class="stat-label">Tasks Done</div></div><div class="stat-card"><div class="stat-number" id="habitsCompleted">0</div><div class="stat-label">Habits</div></div><div class="stat-card"><div class="stat-number" id="completionRate">0%</div><div class="stat-label">Completion</div></div><div class="stat-card"><div class="stat-number" id="streakCount">0</div><div class="stat-label">Day Streak</div></div></div><div class="streak-badge" id="streakMessage"></div><div style="display:flex;gap:1rem;margin-top:1rem;"><button class="theme-toggle" style="flex:1;" onclick="resetDaily()">Reset Today</button><button class="theme-toggle" style="flex:1;" onclick="openShareModal()">✨ Share Progress</button></div></div>
</div></div>

<!-- Calendar and Brain Dump tabs simplified for brevity - keep your existing code -->
<div id="calendarTab" style="display:none;"> <!-- Your calendar content here --> </div>
<div id="braindumpTab" style="display:none;"> <!-- Your brain dump content here --> </div>
</div>

<!-- Include your full dashboard JavaScript here (the working version) -->
<script>

</script>

</body>
</html>
